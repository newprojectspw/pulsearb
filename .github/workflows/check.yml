# CI — roda a suíte de verdade a cada push.
#
# Até o M2.10 o único check que aparecia nos PRs era o SonarCloud, que vem do
# GitHub App e faz análise ESTÁTICA: ele nunca executou `pytest`. Na prática os
# testes só rodavam na máquina de quem estava editando, e um commit que
# quebrasse o backtest chegava ao `main` com o quality gate verde.
#
# Para um projeto que vai mexer com dinheiro real, "passou no meu ambiente"
# não é verificação.
name: check

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio para o GITHUB_TOKEN. Sem este bloco o token herda o escopo
# default do repositório, que pode incluir ESCRITA — e um job que só roda
# lint e teste não tem por que poder empurrar commit, abrir release ou mexer
# em issue. Achado real do SonarCloud no PR #19 (Security Rating C).
#
# Vale mais aqui do que num projeto qualquer: este repositório vai receber
# chave privada de carteira no M4. Todo escopo que o CI não precisa é escopo
# que não pode vazar.
permissions:
  contents: read

# Push novo no mesmo branch cancela a execução anterior: o que importa é o
# último commit, e fila de CI obsoleta só atrasa o resultado que conta.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # `requires-python = ">=3.12"`. Fixar a minor evita que uma
          # atualização do runner troque a versão sem ninguém decidir.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # `analise` junto com `dev` de propósito: sem pyarrow o teste de
      # `replay/columnar.py` cai num `importorskip` e SOME do relatório —
      # a CI passaria rodando menos testes que a máquina do desenvolvedor,
      # que é a forma mais silenciosa de uma suíte apodrecer.
      - name: Instalar
        run: python -m pip install -e ".[dev,analise]"

      # Mesmos alvos do Makefile (`make check`), para que rodar local e rodar
      # aqui não possam divergir.
      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Testes
        run: python -m pytest
