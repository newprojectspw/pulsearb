# 5.3 do ESTADO_PARA_LIVE: pytest e ruff a cada push. O SonarCloud analisa o
# codigo, mas nao RODA nada — sem isto, um teste quebrado so aparece quando
# alguem roda a suite na propria maquina, e o historico mostra que o "alguem"
# costuma descobrir tarde.
name: ci

# O token do workflow so precisa LER o repositorio. Sem esta declaracao ele
# nasce com escrita em tudo, e um passo comprometido (ou uma action de
# terceiro) herdaria esse poder.
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Fixadas por SHA de commit, nao por tag: uma tag pode ser movida por quem
      # controla o repositorio da action; um SHA nao. Verificados via
      # `git ls-remote` nos repositorios oficiais em 2026-08-27.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Por padrao o checkout grava o GITHUB_TOKEN em .git/config, e todo
          # passo seguinte (inclusive uma dependencia comprometida do pip)
          # consegue le-lo. Este workflow nunca faz push — nao ha motivo para
          # deixar a credencial no disco.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: instalar
        run: pip install -e ".[dev]"
      - name: ruff
        run: |
          ruff check src/ tests/ scripts/
      - name: pytest
        run: pytest -q

  docker:
    # Roda em paralelo com `testes`: um build de imagem não depende da suíte,
    # e encadear só faria a falha do Docker demorar mais para aparecer.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Mesma fixação por SHA do job `testes`, e pela mesma razão: uma tag
      # pode ser movida por quem controla o repositório da action; um SHA não.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # `docker build` direto, sem action de terceiro. O runner do GitHub já
      # traz Docker, e cada action a mais é uma dependência que herdaria as
      # permissões do job — o `ci.yml` já declara `contents: read` justamente
      # por essa preocupação. Uma action de build aqui não compraria nada que
      # uma linha de `run` não faça.
      - name: build da imagem
        run: docker build -f deploy/Dockerfile -t pulsearb-recorder:ci .

      # O ENTRYPOINT roda? É o modo de falha que passa no build e morre no
      # arranque: `pip install .` instala só as deps de RUNTIME, e um import
      # de dev em qualquer módulo do caminho do recorder quebraria aqui.
      - name: a imagem arranca
        run: docker run --rm pulsearb-recorder:ci --help

      # O container é não-root? Se este passo imprimir 0, o `USER pulsearb`
      # não pegou, e todo o raciocínio de permissão do Dockerfile cai junto.
      - name: roda como nao-root, com o UID fixo
        run: |
          uid="$(docker run --rm --entrypoint id pulsearb-recorder:ci -u)"
          echo "UID no container: $uid"
          test "$uid" = "10001"

      # O defeito do VOLUME, medido em vez de acreditado — volume ANÔNIMO,
      # que é o que o `mkdir`+`chown` da imagem cobre.
      - name: escreve no volume anonimo
        run: |
          docker run --rm -v /data \
            --entrypoint sh pulsearb-recorder:ci \
            -c 'touch /data/prova && echo ok'

      # E o caso que o RUNBOOK §5 usa de verdade: bind mount. Aqui quem manda
      # é o dono no HOST, e nenhuma linha do Dockerfile alcança isso — por
      # isso o runbook manda `chown 10001:10001`. Este passo prova que a
      # instrução do runbook é suficiente.
      - name: escreve no bind mount com o chown do RUNBOOK
        run: |
          mkdir -p /tmp/pulsearb-data
          sudo chown 10001:10001 /tmp/pulsearb-data
          docker run --rm -v /tmp/pulsearb-data:/data \
            --entrypoint sh pulsearb-recorder:ci \
            -c 'touch /data/prova && echo ok'
          test -f /tmp/pulsearb-data/prova

      # O contexto de build continua pequeno? Sem `.dockerignore` seriam
      # 247 MB aqui e GB na VPS que grava 470 MB/h. Falhar alto se alguém
      # remover uma linha do ignore é mais barato que descobrir no deploy.
      - name: o contexto de build continua enxuto
        run: |
          bytes="$(tar --exclude-vcs -cf - \
            $(git ls-files | head -20000) 2>/dev/null | wc -c)"
          echo "contexto aproximado: $bytes bytes"
          test "$bytes" -lt 20000000
