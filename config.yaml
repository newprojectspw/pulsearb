# PULSEARB — parâmetros de estratégia e infraestrutura.
# Segredos NUNCA entram aqui: vão no .env (ver .env.example).

# Ativos que o bot vai OPERAR (execução futura, M4+).
assets:
  - btc
  - eth

# Ativos extras cujo PREÇO é gravado (recorder), sem operação.
# Dado barato hoje é backtest possível amanhã.
extra_price_assets:
  - sol
  - xrp
  - doge
  - bnb
  - hype

# Durações das janelas: "auto" = descobertas por dados, nunca fixas.
# A verificação ao vivo de 2026-08-16 mostrou que a duração 1h existe na UI
# mas não segue o padrão de slug conhecido — durações hardcoded quebrariam
# silenciosamente (docs/API_NOTES.md seção 12.2).
durations: auto

# Grade de sondagem da descoberta quando durations=auto: durações em segundos
# usadas para GERAR slugs candidatos. É dado de configuração, não constante de
# código; o fallback por keyset pega qualquer duração fora desta lista.
# 3600 (1h) usa padrão de slug próprio, nominal em America/New_York
# (API_NOTES 12.2) — o discovery trata automaticamente.
probe_durations_seconds:
  - 300
  - 900
  - 3600
  - 14400

# Cloudflare devolve 403 (error 1010) para requests sem User-Agent de
# navegador — verificado ao vivo (API_NOTES seção 12.10). Todo cliente
# HTTP/WS do projeto usa este valor.
user_agent: "Mozilla/5.0 (X11; Linux x86_64) pulsearb/0.1"

# Endpoints de produção (verificados — API_NOTES seção 2).
endpoints:
  gamma: "https://gamma-api.polymarket.com"
  clob: "https://clob.polymarket.com"
  clob_market_ws: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  rtds_ws: "wss://ws-live-data.polymarket.com"

feeds:
  # Watchdog POR TIPO DE FEED. O limiar único de 2s do M1 era um bug: a
  # cadência medida ao vivo em 2026-08-16 (API_NOTES 13.1) mostrou p99 de
  # 2,47s no TWAP — o watchdog dispararia falso positivo em operação normal.
  #
  # TWAP: p50 0,86s / p99 2,47s  → 5s
  # spot: p50 1,00s / p99 1,20s  → 3s
  # book do CLOB: silêncio é normal em janela sem negociação, então o limiar
  # é generoso e serve só para detectar conexão morta.
  stale_after_seconds_twap: 5.0
  stale_after_seconds_spot: 3.0
  stale_after_seconds_book: 30.0
  # Reconexão: backoff exponencial com jitter.
  reconnect_initial_seconds: 0.5
  reconnect_max_seconds: 30.0
  # Heartbeat do WS do CLOB (verificado: PING/PONG texto, API_NOTES 6.1).
  clob_ping_interval_seconds: 10.0
  clob_stale_seconds: 30.0

recorder:
  # Diretório de saída dos JSONL comprimidos (coberto pelo .gitignore).
  output_dir: "data/recordings"
  # Rotação de arquivo por hora.
  rotate_seconds: 3600

ui:
  host: "127.0.0.1"
  port: 8080

# Os tetos de dinheiro. TODOS em USDC, todos pequenos de propósito.
#
# Até 2026-09-17 esta seção não existia: os treze valores moravam só no
# default de `RiskSettings` (settings.py), e quem abria este arquivo para
# saber quanto o bot pode perder por dia não achava a resposta (auditoria,
# §2.8). Os valores abaixo SÃO os defaults — escrevê-los aqui não muda o
# comportamento, muda quem decide: subir um teto passa a ser uma linha num
# arquivo versionado, revisada num PR, e não um número escondido no código.
# `tests/test_settings.py` falha se algum campo de `RiskSettings` faltar aqui.
#
# Os números saem do que o M2 mediu (ver a docstring de `RiskSettings`):
# o backtest de 20 h moveu 2,91 USDC por trade; a profundidade mediana a
# 3 ticks na duração mais líquida foi 87,8 USDC. Operar acima disso é apostar
# contra uma medição que já existe.
risk:
  # Teto por ordem. Pequeno o bastante para uma sequência de erros custar
  # menos que uma pizza; grande o bastante para não ser só ruído de taxa.
  stake_max_por_trade_usdc: 5.0
  # Teto por janela de mercado: três entradas de 5 no mesmo mercado ainda
  # são uma aposta só no mesmo movimento.
  stake_max_por_janela_usdc: 15.0
  # Capital simultaneamente em risco, somando todas as janelas.
  exposicao_max_usdc: 50.0
  # Janelas com posição aberta ao mesmo tempo.
  posicoes_max_abertas: 5
  # Disjuntor diário. Ao estourar, GRUDA: não desarma sozinho no dia
  # seguinte e sobrevive a reinício do processo.
  perda_max_diaria_usdc: 25.0
  # Faixa de preço operável. Fora dela o payoff assimétrico transforma erro
  # de modelo em perda desproporcional (comprar a 0,97 arrisca 0,97 por 0,03).
  preco_minimo: 0.05
  preco_maximo: 0.95
  # Perdas seguidas que disparam a pausa, e quanto ela dura. Quatro seguidas
  # com hit rate de 0,59 têm ~2,8 % de chance de acaso: raro o bastante para
  # investigar, comum o bastante para não travar a semana.
  perdas_seguidas_para_pausa: 4
  pausa_apos_sequencia_s: 3600.0
  # Spread acima do qual não se opera: com 0,04 o custo de atravessar iguala
  # o edge exigido pelo critério 1.1 (≥ 0,02), e o trade não pode ganhar.
  spread_maximo: 0.04
  # Atraso máximo entre o carimbo do servidor e a nossa chegada (item 3.10):
  # deriva + latência + fila, somadas. A decisão inteira se apoia em
  # `seconds_left`.
  atraso_max_ms: 250.0
  # Onde o registro do dia mora (sobrevive a reinício) e a chave de
  # emergência: enquanto o arquivo KILL existir, nenhuma ordem passa. É
  # arquivo, não flag, para poder ser acionada por `touch` numa sessão ssh
  # com o bot travado.
  caminho_do_registro: "data/risco/registro_do_dia.json"
  caminho_do_kill: "data/risco/KILL"

# Modo de execução: SIM é o default absoluto. LIVE exige a trava tripla (M4).
mode: SIM
