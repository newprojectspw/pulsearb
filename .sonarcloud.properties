# Por que este arquivo existe, e por que com ESTE nome.
#
# A analise do SonarCloud parou de rodar: o check `SonarCloud Code Analysis`
# volta em ~28 s com
#
#     Number of lines exceeded - Your analysis failed because the total number
#     of lines of code in your organization exceeds your current subscription
#     limit.
#
# Nenhuma linha chega a ser analisada. O check esta vermelho por cota, nao por
# achado, e a ultima analise bem sucedida tem cerca de nove dias.
#
# A alavanca e reduzir as linhas ANALISADAS. A documentacao do SonarQube Cloud
# diz que arquivo excluido da analise nao entra na contagem de uso da licenca
# ("files excluded from analysis are not counted"). Tirar `tests/` corta cerca
# de 10.600 das ~24.000 linhas de codigo do repositorio -- perto de 44% --
# sem tocar em `src/`, que e o que interessa medir.
#
# O nome e `.sonarcloud.properties` DE PROPOSITO. Quem roda aqui e a Automatic
# Analysis (nao ha workflow de Sonar no CI, so o `ci.yml`), e ela IGNORA o
# `sonar-project.properties` -- le apenas este arquivo, e apenas a partir do
# branch padrao. Ou seja: a mudanca so tem efeito depois do merge em `main`.
#
# `scripts/` FICA na analise, de proposito. Sao ~1.900 linhas, 8% do total, e e
# justamente onde o Sonar ja apontou coisa que procedia: o S8707 de travessia
# de caminho em `variancia_de_transicao.py`. Cegar essa pasta economiza pouco e
# custa a analise do unico codigo fora de `src/` que escreve em disco a partir
# de argumento de linha de comando.
#
# O que se perde: achados dentro de `tests/` deixam de aparecer. Os dois S5863
# fechados recentemente eram desse tipo. E o preco de ter analise de `src/` de
# volta -- e sem analise nenhuma nao ha achado em lugar nenhum.
sonar.exclusions=tests/**
