[project]
name = "pulsearb"
version = "0.1.0"
description = "Bot de arbitragem de latência/mispricing para os mercados Up/Down de cripto da Polymarket"
requires-python = ">=3.12"
# Versões pinadas de propósito: o hot path não pode mudar de comportamento
# porque um deploy resolveu dependências diferentes. Subir versão é decisão
# consciente, com changelog lido.
dependencies = [
    "uvloop==0.22.1",
    "orjson==3.12.0",
    "websockets==17.0.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "aiosqlite==0.22.1",
    "pyyaml==6.0.3",
    # M4 — assinatura EIP-712 das ordens (execution/ordem.py). E a mesma
    # biblioteca que o SDK oficial usa por baixo, e a unica coisa dele que
    # valia importar: a criptografia. O SDK inteiro NAO entra porque exige
    # websockets<16 e rebaixaria o pacote do caminho quente — ver o adendo do
    # API_NOTES secao 1.4 e o cabecalho de execution/auth.py.
    "eth-account==0.13.7",
]
# NOTA: polymarket-client (SDK oficial) NÃO é dependência de runtime no M1.
# Só entra no M4, exclusivamente para assinatura de ordens (EIP-712/HMAC).
# Decisão registrada em docs/API_NOTES.md seção 1.4.

[project.optional-dependencies]
# Extra de ANÁLISE, não de runtime. Só a máquina que roda backtest instala:
# a VPS que grava não converte nada, e carregar ~40 MB de biblioteca colunar
# lá não compraria nada. Ver src/pulsearb/replay/columnar.py.
analise = [
    "pyarrow==23.0.1",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.3",
    "mypy==2.3.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `from tests...` funciona com `python -m pytest` porque o -m poe o cwd no
# sys.path — e quebra com o executavel `pytest`, que nao poe. Foi exatamente
# a primeira rodada do CI que expos a diferenca. Declarar aqui vale para as
# duas formas de invocar.
pythonpath = ["."]
# Nenhum teste depende de rede externa — regra do M1 (sandbox sem egress).
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF", "C901"]
# RUF002/RUF003: docstrings e comentários em português usam notação
# matemática (−, ×, ≥, σ) de propósito. Trocar por ASCII pioraria a leitura
# das fórmulas de fee e do modelo TWAP.
ignore = ["RUF002", "RUF003"]

# C901: função complexa demais. Entrou em 2026-09-15 porque a complexidade do
# `_passo_da_janela` reprovou o portão de qualidade do SonarCloud no #127 — e
# o Sonar é ilegível da sessão da nuvem (403 no túnel), então o defeito só
# aparecia DEPOIS do push, uma volta inteira de CI por vez. Agora aparece no
# `make check`. O limite é 12 porque é onde o projeto inteiro já estava, fora
# das três exceções nomeadas abaixo: a trava é contra PIORAR, não uma dívida
# nova. Não é a mesma métrica do Sonar (que usa complexidade cognitiva, com
# peso por aninhamento), mas anda junto o bastante para avisar antes.
[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# C901 herdado, de antes da regra. Nenhuma é do caminho ao vivo do maker:
# `_cotar`/`_passo` do simulador de pares e `medir_markout` da análise são
# laços de medição sobre gravação, e reescrevê-los mudaria número publicado
# sem ninguém pedir. Fica a dívida nomeada, não um limite frouxo para todos.
"scripts/maker_de_pares.py" = ["C901"]
"src/pulsearb/analysis/measurements.py" = ["C901"]
# Scripts standalone: rodam FORA do projeto (Colab/VPS recém-criada), com
# stdlib pura e Python antigo. UP017 (datetime.UTC) exige 3.11+ e UP035/UP006
# modernizam para sintaxe que 3.9/3.10 não aceitam — ignorar aqui é o que
# mantém a portabilidade que esses scripts prometem.
"scripts/*" = ["E501", "UP017", "UP035", "UP006"]
# server.py embute um documento HTML/CSS/JS inteiro numa string: quebrar
# essas linhas em 100 colunas estragaria o HTML sem ganhar legibilidade.
"src/pulsearb/ui/server.py" = ["E501"]

[tool.mypy]
# Auditoria de 2026-09-17, §2.7: 44 erros de tipo e nada no CI. O PR
# seguinte (#141) introduziu três regressões que SÓ o mypy via — e uma
# delas chegou ao main porque o commit que a fechava ficou fora do squash.
# Desde então roda no `make check` e no CI. Não é `strict`: é a trava contra
# PIORAR, na mesma lógica do C901 acima.
python_version = "3.12"
files = ["src/pulsearb"]
ignore_missing_imports = true

# BASELINE: os módulos que já tinham erro quando o mypy entrou (40 erros em
# 12 arquivos, medidos em 2026-09-17). A lista SÓ ENCOLHE — consertar um
# módulo é tirá-lo daqui no mesmo commit, e o mypy passa a guardá-lo.
# Adicionar módulo a ela é o que não se faz: o erro novo se conserta.
[[tool.mypy.overrides]]
module = [
    "pulsearb.analysis.integrity",
    "pulsearb.analysis.variancia_de_transicao",
    "pulsearb.backtest.report",
    "pulsearb.backtest.runner",
    "pulsearb.engine.decisao",
    "pulsearb.execution.auth",
    "pulsearb.execution.executor",
    "pulsearb.live.laco_maker",
    "pulsearb.live.repouso",
    "pulsearb.recorder.__main__",
    "pulsearb.recorder.writer",
    "pulsearb.replay.columnar",
]
ignore_errors = true
